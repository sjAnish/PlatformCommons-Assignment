server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bookmyshow
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: 1234567890123456789012345678901234567890

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha